{% extends 'base.html' %}

{% block title %}User Profile Management | SonicSentinel AI{% endblock %}

{% block content %}
<div class="container" style="max-width: 800px; margin: 30px auto 60px;">
  
  <div class="card" style="padding: 34px;">
    
    <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 24px; margin-bottom: 24px; flex-wrap: wrap; gap: 15px;">
      
      <div style="display: flex; align-items: center; gap: 18px;">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--accent-gradient); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 700; box-shadow: 0 0 20px var(--accent-cyan-glow);">
          {{ user.name[0] }}
        </div>
        <div>
          <h2 style="font-family: var(--font-display); font-size: 1.6rem; font-weight: 700;">
            {{ user.name }}
          </h2>
          <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px;">
            <span class="user-role-pill" style="font-size: 0.8rem; padding: 3px 10px;">
              <i class="fa-solid fa-shield"></i> {{ user.role }}
            </span>
            <span style="color: var(--text-muted); font-size: 0.82rem;">{{ user.email }}</span>
          </div>
        </div>
      </div>

      <!-- Unique User ID Display -->
      <div style="background: var(--bg-secondary); border: 1px solid var(--border-highlight); padding: 12px 18px; border-radius: 12px; text-align: right;">
        <div style="font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-family: var(--font-mono);">
          Unique User ID
        </div>
        <div style="font-size: 1.15rem; font-weight: 800; font-family: var(--font-mono); color: var(--text-accent);">
          {{ user.id }}
        </div>
      </div>

    </div>

    <!-- Edit Profile Form -->
    <form action="{{ url_for('profile') }}" method="POST">
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" name="name" class="form-control" value="{{ user.name }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address (Read Only)</label>
          <input type="email" id="email" class="form-control" value="{{ user.email }}" disabled style="opacity: 0.7;">
        </div>

        <div class="form-group">
          <label class="form-label" for="department">Assigned Unit / Department</label>
          <input type="text" id="department" name="department" class="form-control" value="{{ user.department }}">
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Role Permission Level</label>
          <select id="role" name="role" class="form-select">
            {% for r in user_roles %}
              <option value="{{ r }}" {% if r == user.role %}selected{% endif %}>{{ r }}</option>
            {% endfor %}
          </select>
        </div>

      </div>

      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
          Back to Dashboard
        </a>
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-floppy-disk"></i> Save Profile Changes
        </button>
      </div>

    </form>

  </div>

</div>
{% endblock %}

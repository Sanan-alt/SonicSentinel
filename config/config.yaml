# SonicSentinel AI - central configuration
# All paths are relative to the project root.

paths:
  # Raw source data as delivered.
  esc50_audio: "Dataset/Dataset/audio"          # ESC-50 original 44.1kHz clips (2000 files)
  esc50_meta: "esc50.csv"                        # target -> ESC-50 category map
  mp3_folders:                                   # extra hand-collected mp3 folders (folder key -> path)
    # Each folder maps to the SRS class whose audio it ACTUALLY contains
    # (see src/sonic/labels.py -> MP3_FOLDER_TO_SRS). The organiser de-dups by
    # content hash, so if two folders hold byte-identical files only one copy
    # is kept (under the FIRST-listed folder's class). Add more folders freely:
    # any new "<class>: Dataset/<Your Folder>" line is picked up automatically.
    aggression: "Dataset/Aggression"
    glassbreak: "Dataset/Glass breaking"
    help: "Dataset/Help"
    gunshot: "Dataset/gunshot"
    panic_scream: "Dataset/Panic scream"
    # User-contributed clips (reviewer-labelled uploads / live captures). These
    # live in per-class subfolders (Dataset/user_uploads/<class>/) and are added
    # automatically by the background trainer - see webapp/services/trainer.py.
    user_uploads: "Dataset/user_uploads"
  # Generated outputs.
  # NOTE: C: drive is full on this machine, so heavy generated artefacts live
  # on D:. Change output_root to a path on any drive with free space.
  output_root: "D:/sonicsentinel_data"
  categorized: "categorized_audio"               # organised copies by SRS class (under output_root)
  metadata_csv: "dataset_metadata.csv"           # SRS dataset metadata (under output_root)
  features_file: "features.npz"                  # extracted acoustic features (under output_root)
  models_dir: "python_models"                    # saved models + preprocessing pipeline (under output_root)
  reports_dir: "reports"                          # metrics, confusion matrices, plots (under output_root)
  gtm_model_dir: "gtm_model"                     # real Google Teachable Machine export lives in <this>/export/ (human-supplied)
  uploads_dir: "uploads"                         # user-uploaded audio (under output_root)
  visuals_dir: "visuals"                         # generated waveform/spectrogram PNGs (under output_root)
  database: "sonicsentinel.db"                   # SQLite database file (under output_root)
  alert_rules: "alert_rules/alert_rules.json"    # configurable alert rules (project root)

# Audio preprocessing settings (SRS Step 4 / xi).
audio:
  sample_rate: 22050        # target resample rate (Hz)
  mono: true                # stereo -> mono
  duration: 5.0             # fixed clip length in seconds (pad/truncate)
  top_db: 30                # silence trimming threshold
  normalize: true           # peak amplitude normalisation

# The 10 mandatory SRS sound classes (fixed order = model label order).
classes:
  - machinery_fault
  - glass_breaking
  - alarm_siren
  - vehicle_horn
  - animal_sound
  - gunshot
  - panic_scream
  - person_asking_for_help
  - aggression
  - background_noise

# Classes treated as critical for recall reporting (SRS NFR-4).
critical_classes:
  - gunshot
  - glass_breaking
  - panic_scream
  - aggression
  - person_asking_for_help

# Stratified split ratios (SRS: 70/15/15).
split:
  train: 0.70
  val: 0.15
  test: 0.15
  seed: 42

# Feature extraction settings (SRS Step 6 / xx).
# n_fft=1024 keeps peak memory low (this machine has ~7 GB RAM); it is still a
# strong window for 22.05 kHz sound-event features. Raise to 2048 on a machine
# with more free memory for slightly finer spectral resolution.
features:
  n_mfcc: 40
  n_mels: 128
  n_fft: 1024
  hop_length: 512

# Data augmentation (SRS requirement xix). Applied to TRAIN split only.
augmentation:
  enabled: true
  per_clip: 2               # augmented copies per training clip (keeps peak RAM low)
  methods:                  # augmentations to sample from
    - add_noise
    - time_shift
    - pitch_shift
    - pitch_up
    - pitch_down
    - time_stretch
    - speed_change
    - volume_adjust
    - reverb
    - distance_sim
    - device_sim
    - freq_filter

# Training settings.
training:
  seed: 42
  hyperparameter_tuning: true   # GridSearchCV over small grids (SRS xxiv)
  # Models to compare (SRS Step 7: at least three). Gradient boosting is
  # available in the code but excluded here because it is very slow to tune on
  # the augmented set; XGBoost provides gradient boosting far more efficiently.
  models:
    - svm
    - random_forest
    - xgboost
  # A SECOND independent Python model trained on the same split, used for the
  # cross-model comparison report (SRS Step 7 requires comparing >=3 models).
  # This is NOT Google Teachable Machine. GTM is a separate, browser-exported
  # audio model loaded from models/gtm/export/ by webapp/services/gtm_service.py.
  second_model: random_forest
